<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم جامع حضور و غیاب مدرسه</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, 'Segoe UI', Arial, sans-serif; }
        body { background-color: #eef2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 100%; max-width: 900px; }
        
        /* تب ها */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; overflow-x: auto; }
        .tab-btn { background: none; border: none; font-size: 15px; font-weight: bold; color: #777; cursor: pointer; padding: 10px 15px; border-radius: 8px 8px 0 0; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { color: #2196F3; border-bottom: 3px solid #2196F3; background: #f0f8ff; }
        
        /* هدر */
        .header-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .control-group { display: flex; flex-direction: column; flex: 1; min-width: 120px; }
        label { font-size: 12px; color: #555; margin-bottom: 5px; font-weight: bold; }
        select, input[type="text"], input[type="number"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; width: 100%; }
        
        /* دکمه ها */
        button { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: bold; transition: 0.2s; }
        .btn-add { background-color: #4CAF50; color: white; }
        .btn-export { background-color: #2196F3; color: white; width: 100%; margin-top: 15px; padding: 12px; font-size: 16px;}
        .btn-save { background-color: #FF9800; color: white; width: 100%; margin-top: 10px; padding: 12px; font-size: 16px;}
        .btn-refresh { background-color: #9C27B0; color: white; width: 100%; margin-top: 15px; padding: 12px; font-size: 16px;}
        
        /* لیست */
        ul { list-style: none; padding: 0; margin: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #fff; border: 1px solid #e0e0e0; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s; border-right: 6px solid #4CAF50; }
        .student-info { display: flex; flex-direction: column; }
        .student-name { font-weight: bold; font-size: 15px; color: #333; }
        .student-stats { font-size: 12px; color: #777; margin-top: 4px; }
        
        /* وضعیت ها */
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; color: white; }
        .status-present { background-color: #4CAF50; }
        .status-absent { background-color: #f44336; }
        .status-late { background-color: #FF9800; }
        li.absent { border-right-color: #f44336; background: #fff4f4; }
        li.late { border-right-color: #FF9800; background: #fffaf0; }
        
        .empty-msg { text-align: center; color: #999; padding: 20px; }
        
        /* داشبورد مدیر */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .dashboard-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; border-top: 5px solid #4CAF50; }
        .dashboard-card.has-absent { border-top-color: #f44336; background: #fff4f4; }
        .dashboard-card h4 { margin: 0 0 10px 0; color: #333; }
        .absent-count { font-size: 24px; font-weight: bold; color: #f44336; }

        /* بخش مدیریت اسامی */
        .master-list-item { display: inline-flex; align-items: center; background: #e3f2fd; padding: 5px 10px; border-radius: 20px; margin: 5px; font-size: 14px; }
        .master-list-item button { background: #ff5252; color: white; border-radius: 50%; width: 20px; height: 20px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 8px; }
    </style>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA-Z-V2zpEcnbpHvRXedSjWfbt5QWEnG4g",
            authDomain: "deghanscoole.firebaseapp.com",
            databaseURL: "https://deghanscoole-default-rtdb.firebaseio.com",
            projectId: "deghanscoole",
            storageBucket: "deghanscoole.firebasestorage.app",
            messagingSenderId: "364726819585",
            appId: "1:364726819585:web:f969f83454090456405900"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
        window.update = update;
        window.get = get;
        window.firebaseReady = true;
        
        document.dispatchEvent(new Event('firebaseLoaded'));
    </script>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; color: #2c3e50; margin-top: 0;">🏫 سیستم جامع حضور و غیاب</h2>
    
    <!-- تب ها -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('manage')">⚙️ ۱. تعریف اسامی</button>
        <button class="tab-btn" onclick="switchTab('attendance')">📋 ۲. ثبت غیبت</button>
        <button class="tab-btn" onclick="switchTab('dashboard')">👨‍💼 ۳. داشبورد معاون</button>
    </div>

    <!-- بخش ۱: مدیریت اسامی -->
    <div id="manageSection">
        <div class="header-controls">
            <div class="control-group">
                <label>📚 انتخاب کلاس:</label>
                <select id="manageClassSelect">
                    <option value="1a">اول الف</option><option value="1b">اول ب</option>
                    <option value="2a">دوم الف</option><option value="2b">دوم ب</option>
                    <option value="3a">سوم الف</option><option value="3b">سوم ب</option>
                    <option value="4a">چهارم الف</option><option value="4b">چهارم ب</option>
                    <option value="5a">پنجم الف</option><option value="5b">پنجم ب</option>
                    <option value="6a">ششم الف</option><option value="6b">ششم ب</option>
                </select>
            </div>
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="newStudentName" placeholder="نام دانش‌آموز..." style="flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px;">
            <button class="btn-add" onclick="addStudentName()" style="padding: 12px 25px;">➕ افزودن</button>
        </div>
        <div id="masterListContainer" style="margin-top: 15px; min-height: 50px; padding: 10px; background: #fafafa; border-radius: 8px; border: 1px dashed #ccc;"></div>
        <button class="btn-save" onclick="saveMasterListToFirebase()">💾 ذخیره نهایی لیست</button>
    </div>

    <!-- بخش ۲: ثبت حضور و غیاب -->
    <div id="attendanceSection" style="display: none;">
        <div class="header-controls">
            <div class="control-group">
                <label>📚 کلاس:</label>
                <select id="classSelect" onchange="loadClassData()">
                    <option value="1a">اول الف</option><option value="1b">اول ب</option>
                    <option value="2a">دوم الف</option><option value="2b">دوم ب</option>
                    <option value="3a">سوم الف</option><option value="3b">سوم ب</option>
                    <option value="4a">چهارم الف</option><option value="4b">چهارم ب</option>
                    <option value="5a">پنجم الف</option><option value="5b">پنجم ب</option>
                    <option value="6a">ششم الف</option><option value="6b">ششم ب</option>
                </select>
            </div>
            <div class="control-group">
                <label>📅 ماه:</label>
                <select id="monthSelect" onchange="loadClassData()">
                    <option value="07">مهر</option><option value="08">آبان</option><option value="09">آذر</option>
                    <option value="10">دی</option><option value="11">بهمن</option><option value="12">اسفند</option>
                    <option value="01">فروردین</option><option value="02">اردیبهشت</option><option value="03">خرداد</option>
                    <option value="04">تیر</option><option value="05">مرداد</option><option value="06">شهریور</option>
                </select>
            </div>
            <div class="control-group" style="max-width: 80px;">
                <label>📅 روز:</label>
                <input type="number" id="dayInput" min="1" max="31" value="1" onchange="loadClassData()">
            </div>
            <div class="control-group" style="flex: 2; min-width: 150px;">
                <label>📅 تاریخ:</label>
                <div id="shamsiDateDisplay" style="padding: 10px; background: #e3f2fd; border-radius: 6px; font-weight: bold; color: #1565c0; text-align: center;"></div>
            </div>
        </div>
        <div id="listContainer"><ul id="studentList"></ul></div>
        <button class="btn-export" onclick="exportToExcel()">📥 دانلود فایل اکسل</button>
    </div>

    <!-- بخش ۳: داشبورد (نسخه اصلاح شده) -->
    <div id="dashboardSection" style="display: none;">
        <div class="header-controls">
            <div class="control-group">
                <label>📅 ماه:</label>
                <select id="dashMonthSelect" onchange="loadDashboard()">
                    <option value="07">مهر</option><option value="08">آبان</option><option value="09">آذر</option>
                    <option value="10">دی</option><option value="11">بهمن</option><option value="12">اسفند</option>
                    <option value="01">فروردین</option><option value="02">اردیبهشت</option><option value="03">خرداد</option>
                    <option value="04">تیر</option><option value="05">مرداد</option><option value="06">شهریور</option>
                </select>
            </div>
            <div class="control-group" style="max-width: 80px;">
                <label>📅 روز:</label>
                <input type="number" id="dashDayInput" min="1" max="31" value="1" onchange="loadDashboard()">
            </div>
            <div class="control-group" style="flex: 2;">
                <label>📅 تاریخ انتخاب شده:</label>
                <div id="dashDateDisplay" style="padding: 10px; background: #f3e5f5; border-radius: 6px; font-weight: bold; color: #7b1fa2; text-align: center;"></div>
            </div>
        </div>
        
        <button class="btn-refresh" onclick="loadDashboard()">🔄 بروزرسانی زنده</button>
        <div id="dashboardContainer" class="dashboard-grid"></div>
    </div>
</div>

<script>
    let currentClassData = {};
    let tempMasterList = []; 

    // تنظیمات اولیه
    document.getElementById('monthSelect').value = "07";
    document.getElementById('dayInput').value = 1;
    document.getElementById('dashMonthSelect').value = "07";
    document.getElementById('dashDayInput').value = 1;

    // تغییر تب
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.container > div[id$="Section"]').forEach(sec => sec.style.display = 'none');
        
        if (tabName === 'manage') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('manageSection').style.display = 'block';
            loadManageClass();
        } else if (tabName === 'attendance') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('attendanceSection').style.display = 'block';
            loadClassData();
        } else if (tabName === 'dashboard') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('dashboardSection').style.display = 'block';
            loadDashboard();
        }
    }

    // بخش مدیریت اسامی
    function loadManageClass() {
        const cls = document.getElementById('manageClassSelect').value;
        if (!window.firebaseReady) return;
        const masterRef = window.ref(window.db, `masterStudents/${cls}`);
        window.get(masterRef).then((snapshot) => {
            const names = snapshot.val() || [];
            tempMasterList = [...names]; 
            renderMasterList();
        });
    }

    function renderMasterList() {
        const listContainer = document.getElementById('masterListContainer');
        listContainer.innerHTML = '';
        if (tempMasterList.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg" style="color:#999;">هنوز دانش‌آموزی ثبت نشده است.</div>';
            return;
        }
        tempMasterList.forEach((name, index) => {
            const tag = document.createElement('div');
            tag.className = 'master-list-item';
            tag.innerHTML = `<button onclick="removeStudentName(${index})">✖</button> <span>${name}</span>`;
            listContainer.appendChild(tag);
        });
    }

    function addStudentName() {
        const input = document.getElementById('newStudentName');
        const name = input.value.trim();
        if (name === '') return alert('لطفاً نام را وارد کنید.');
        if (tempMasterList.includes(name)) return alert('این اسم قبلاً وجود دارد.');
        tempMasterList.push(name);
        input.value = '';
        renderMasterList();
    }

    function removeStudentName(index) {
        if (confirm('حذف شود؟')) {
            tempMasterList.splice(index, 1);
            renderMasterList();
        }
    }

    function saveMasterListToFirebase() {
        const cls = document.getElementById('manageClassSelect').value;
        const masterRef = window.ref(window.db, `masterStudents/${cls}`);
        window.set(masterRef, tempMasterList).then(() => {
            alert('✅ لیست با موفقیت ذخیره شد.');
        }).catch((error) => { alert('خطا: ' + error.message); });
    }

    // بخش ثبت حضور و غیاب
    function getShamsiKey(monthId, dayId) {
        let month = document.getElementById(monthId).value;
        let day = document.getElementById(dayId).value;
        if(day.length < 2) day = "0" + day;
        let year = "1405";
        if (parseInt(month) >= 1 && parseInt(month) <= 6) year = "1406";
        return `${year}-${month}-${day}`;
    }

    function updateDateDisplay(dateId, monthId, dayId) {
        const monthSelect = document.getElementById(monthId);
        const monthName = monthSelect.options[monthSelect.selectedIndex].text;
        const key = getShamsiKey(monthId, dayId);
        const parts = key.split('-');
        document.getElementById(dateId).innerText = `${parts[2]} ${monthName} ${parts[0]}`;
    }

    function loadClassData() {
        updateDateDisplay('shamsiDateDisplay', 'monthSelect', 'dayInput');
        const currentClass = document.getElementById('classSelect').value;
        const currentDate = getShamsiKey('monthSelect', 'dayInput');
        const attendanceRef = window.ref(window.db, `attendance/${currentClass}/${currentDate}`);
        window.onValue(attendanceRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentClassData = data;
                renderList(data);
            } else {
                const masterRef = window.ref(window.db, `masterStudents/${currentClass}`);
                window.get(masterRef).then((masterSnapshot) => {
                    const names = masterSnapshot.val() || [];
                    if (names.length === 0) {
                        document.getElementById('studentList').innerHTML = '<div class="empty-msg">دانش‌آموزی تعریف نشده است.</div>';
                        return;
                    }
                    const newData = {};
                    names.forEach(name => { newData[name] = { status: 'present', weekAbsents: 0 }; });
                    window.set(attendanceRef, newData);
                    currentClassData = newData;
                    renderList(newData);
                });
            }
        });
    }

    function renderList(data) {
        const listElement = document.getElementById('studentList');
        listElement.innerHTML = '';
        const names = Object.keys(data);
        if (names.length === 0) {
            listElement.innerHTML = '<div class="empty-msg">لیست خالی است.</div>';
            return;
        }
        names.forEach(name => {
            const student = data[name];
            const li = document.createElement('li');
            if (student.status === 'absent') li.classList.add('absent');
            if (student.status === 'late') li.classList.add('late');
            let statusText = 'حاضر'; let badgeClass = 'status-present';
            if (student.status === 'absent') { statusText = 'غایب'; badgeClass = 'status-absent'; }
            if (student.status === 'late') { statusText = 'تاخیر'; badgeClass = 'status-late'; }
            li.innerHTML = `
                <div class="student-info">
                    <span class="student-name">${name}</span>
                    <span class="student-stats">📊 غیبت هفته: ${student.weekAbsents || 0} روز</span>
                </div>
                <span class="status-badge ${badgeClass}">${statusText}</span>
            `;
            li.onclick = () => toggleStatus(name, student);
            listElement.appendChild(li);
        });
    }

    function toggleStatus(name, student) {
        const currentClass = document.getElementById('classSelect').value;
        const currentDate = getShamsiKey('monthSelect', 'dayInput');
        let newStatus = 'present'; let newAbsents = student.weekAbsents || 0;
        if (student.status === 'present') { newStatus = 'absent'; newAbsents++; }
        else if (student.status === 'absent') { newStatus = 'late'; newAbsents = Math.max(0, newAbsents - 1); }
        const studentRef = window.ref(window.db, `attendance/${currentClass}/${currentDate}/${name}`);
        window.update(studentRef, { status: newStatus, weekAbsents: newAbsents });
    }

    function exportToExcel() {
        const currentClass = document.getElementById('classSelect').value;
        const currentDate = getShamsiKey('monthSelect', 'dayInput');
        const className = document.getElementById('classSelect').options[document.getElementById('classSelect').selectedIndex].text;
        if (Object.keys(currentClassData).length === 0) return alert('لیست خالی است!');
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += `کلاس:,${className},تاریخ:,${currentDate}\n\n`;
        csvContent += "ردیف,نام دانش‌آموز,وضعیت,غیبت هفته\n";
        let index = 1;
        Object.keys(currentClassData).forEach(name => {
            const student = currentClassData[name];
            let statusText = student.status === 'absent' ? "غایب" : (student.status === 'late' ? "تاخیر" : "حاضر");
            csvContent += `${index++},"${name}","${statusText}","${student.weekAbsents || 0}"\n`;
        });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Attendance_${className}_${currentDate}.csv`);
        document.body.appendChild(link);
        link.click();
    }

    // داشبورد (اصلاح شده)
    function loadDashboard() {
        updateDateDisplay('dashDateDisplay', 'dashMonthSelect', 'dashDayInput');
        const date = getShamsiKey('dashMonthSelect', 'dashDayInput');
        
        const container = document.getElementById('dashboardContainer');
        container.innerHTML = '<div class="empty-msg">در حال بارگذاری...</div>';
        
        const dbRef = window.ref(window.db, `attendance`);
        window.onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            container.innerHTML = '';
            if (!data) { container.innerHTML = '<div class="empty-msg">اطلاعاتی ثبت نشده.</div>'; return; }
            
            const classes = ['1a', '1b', '2a', '2b', '3a', '3b', '4a', '4b', '5a', '5b', '6a', '6b'];
            const classNames = { '1a': 'اول الف', '1b': 'اول ب', '2a': 'دوم الف', '2b': 'دوم ب', '3a': 'سوم الف', '3b': 'سوم ب', '4a': 'چهارم الف', '4b': 'چهارم ب', '5a': 'پنجم الف', '5b': 'پنجم ب', '6a': 'ششم الف', '6b': 'ششم ب' };
            
            let hasAnyData = false;
            classes.forEach(cls => {
                const classData = data[cls] ? data[cls][date] : null;
                if (classData) {
                    hasAnyData = true;
                    let absentCount = 0; let absentNames = [];
                    Object.keys(classData).forEach(name => {
                        if (classData[name].status === 'absent') { absentCount++; absentNames.push(name); }
                    });
                    const card = document.createElement('div');
                    card.className = `dashboard-card ${absentCount > 0 ? 'has-absent' : ''}`;
                    card.innerHTML = `<h4>${classNames[cls]}</h4><div class="absent-count">${absentCount} غایب</div><div style="font-size: 12px; color: #666;">${absentNames.length > 0 ? absentNames.join('، ') : 'همه حاضر'}</div>`;
                    container.appendChild(card);
                }
            });
            if (!hasAnyData) container.innerHTML = '<div class="empty-msg">در این تاریخ اطلاعاتی ثبت نشده است.</div>';
        });
    }

    // شروع
    document.addEventListener('firebaseLoaded', () => {
        switchTab('manage'); 
    });
</script>
</body>
</html>
